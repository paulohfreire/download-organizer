[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "download-organizer"
version = "0.1.0"
description = "A safe, rule-based Windows download organizer"
requires-python = ">=3.11"
dependencies = ["watchdog>=4"]

[project.scripts]
download-organizer = "download_organizer.cli:main"
download-organizer-desktop = "download_organizer.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
